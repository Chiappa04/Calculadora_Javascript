<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <meta name="discription" content="Calculadora simples">
  <title>Calculadora</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <div class="titulo">
            <h1>Calculadora</h1>
        </div>
        <div class="subtitulo">
            <h2>Calcule Aqui</h2>
        </div>
    </header> 
    <main>
        <div class="calculadora">
            <input class="visor" type="number" value="0">
            <div class="botoes">
                <div class="botoesumaotres">
                    <div><button class="botaoum">1</button></div>
                    <div><button class="botaodois">2</button></div>
                    <div><button class="botaotres">3</button></div>
                </div>
            <div class="botoesquatroaoseis">
                <div><button  class="botaoquatro">4</button></div>
                <div><button  class="botaocinco">5</button></div>
                <div><button  class="botaoseis">6</button></div>
            </div>
                <div class="botoesseteaonove">
                <div><button class="botaosete">7</button></div>
                <div><button class="botaooito">8</button></div>
                <div><button class="botaonove">9</button></div>
            </div>
            <div class="botaozeroc">
                <div><button class="botaozero">0</button></div>
            </div>
            <div class="botoesoperacionais">
                <div><button class="botaomais">+</button></div>
                <div><button class="botaomenos">-</button></div>
                <div><button class="botaomultiplicacao">x</button></div>
                <div><button class="botaodivisao">%</button></div>
                <div><button class="botaoigual">=</button></div>
                <div><button class="botaoc" onclick="clickClear()">C</button></div>
            </div>
            </div>
        </div>
    </main>
    <footer>
    </footer>
    <script src="script.js"></script>
</body>
</html>
